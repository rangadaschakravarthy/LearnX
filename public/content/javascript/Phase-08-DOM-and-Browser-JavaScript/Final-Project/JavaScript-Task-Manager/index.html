<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Task Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="storage.js" defer></script>
    <script src="dom.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body>
    <div class="app-layout">
        <header>
            <h1>Task Manager</h1>
            <p>Organize your tasks efficiently using Vanilla JavaScript</p>
        </header>

        <section class="task-form-section">
            <form id="task-form">
                <input type="text" id="task-title" placeholder="Enter task title..." required>
                <select id="task-category">
                    <option value="Work">Work</option>
                    <option value="Personal">Personal</option>
                    <option value="Study">Study</option>
                </select>
                <select id="task-priority">
                    <option value="Low">Low Priority</option>
                    <option value="Medium" selected>Medium Priority</option>
                    <option value="High">High Priority</option>
                </select>
                <button type="submit" id="add-btn">Add Task</button>
            </form>
        </section>

        <section class="task-controls">
            <input type="text" id="search-input" placeholder="Search tasks...">
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
        </section>

        <main id="task-container" class="task-list"></main>

        <footer>
            <span id="task-counter">0 tasks remaining</span>
            <button id="clear-completed-btn">Clear Completed</button>
        </footer>
    </div>
</body>
</html>
