<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Data Analyzer — Day 09 Mini-Project</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --muted-text: #94a3b8;
      --border-color: #334155;
      --success-color: #4ade80;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      color: var(--accent-color);
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
    }
    textarea {
      width: 100%;
      height: 180px;
      background: #090d16;
      color: #38bdf8;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-family: monospace;
      padding: 10px;
      box-sizing: border-box;
    }
    button {
      background: var(--accent-color);
      color: #0f172a;
      border: none;
      padding: 10px 20px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      opacity: 0.9;
    }
    ul {
      list-style-type: none;
      padding-left: 0;
    }
    li {
      padding: 6px 0;
      border-bottom: 1px dashed var(--border-color);
    }
    .metric {
      font-size: 1.2em;
      font-weight: bold;
      color: var(--success-color);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎓 Student Data Analyzer (Advanced Looping)</h1>
    <p>Processes nested student JSON records using <code>for...of</code>, <code>for...in</code>, and <code>Object.entries()</code>.</p>
    
    <div class="grid">
      <div class="card">
        <h3>Input JSON Dataset</h3>
        <textarea id="jsonInput"></textarea>
        <button id="analyzeBtn">Run Analysis</button>
      </div>

      <div class="card">
        <h3>Analysis Results</h3>
        <div id="results">
          <p class="muted">Click "Run Analysis" to calculate metrics...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
