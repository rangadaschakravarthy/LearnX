<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 08 — Number Analysis Toolkit</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 2rem;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2rem;
      max-width: 600px;
      margin: 0 auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h2 { color: #38bdf8; margin-top: 0; }
    .form-group { margin-bottom: 1rem; }
    input {
      width: 100%;
      padding: 0.75rem;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #38bdf8;
      font-family: monospace;
      font-size: 1rem;
      box-sizing: border-box;
      margin-bottom: 0.75rem;
    }
    button {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-right: 0.4rem;
      margin-bottom: 0.4rem;
    }
    button:hover { background-color: #0369a1; }
    .output-box {
      background-color: #090d16;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 1.25rem;
      font-family: monospace;
      margin-top: 1.25rem;
      color: #4ade80;
      line-height: 1.8;
    }
  </style>
  <script src="script.js" defer></script>
</head>
<body>

  <div class="card">
    <h2>🔢 Number Analysis Toolkit</h2>

    <div class="form-group">
      <label>Enter Integer Target:</label>
      <input type="number" id="numberInput" value="17">
    </div>

    <div>
      <button onclick="analyzeNumber()">Analyze Number Metrics</button>
      <button onclick="setTarget(17)">Test 17 (Prime)</button>
      <button onclick="setTarget(5)">Test 5 (Factorial)</button>
      <button onclick="setTarget(121)">Test 121 (Palindrome)</button>
    </div>

    <div id="toolkitOutput" class="output-box">Click "Analyze Number Metrics" to run loop calculations.</div>
  </div>

</body>
</html>
