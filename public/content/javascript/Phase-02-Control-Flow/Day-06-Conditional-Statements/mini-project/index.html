<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 06 — Grade &amp; Eligibility Analyzer</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 2rem;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2rem;
      max-width: 550px;
      margin: 0 auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h2 { color: #38bdf8; margin-top: 0; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.4rem; color: #94a3b8; font-weight: 600; }
    input {
      width: 100%;
      padding: 0.75rem;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #38bdf8;
      font-family: monospace;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 0.5rem;
    }
    button:hover { background-color: #0369a1; }
    .output-box {
      background-color: #090d16;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 1.25rem;
      font-family: monospace;
      margin-top: 1.25rem;
      color: #4ade80;
      line-height: 1.8;
    }
  </style>
  <script src="script.js" defer></script>
</head>
<body>

  <div class="card">
    <h2>🎓 Grade &amp; Eligibility Analyzer</h2>

    <div class="form-group">
      <label for="marksInput">Student Marks (0 - 100):</label>
      <input type="number" id="marksInput" value="85" min="0" max="100">
    </div>

    <div class="form-group">
      <label for="attendanceInput">Attendance Percentage (0 - 100%):</label>
      <input type="number" id="attendanceInput" value="88" min="0" max="100">
    </div>

    <button onclick="analyzeStudent()">Analyze Student Status</button>

    <div id="outputDisplay" class="output-box">Click "Analyze Student Status" to run evaluation logic.</div>
  </div>

</body>
</html>
