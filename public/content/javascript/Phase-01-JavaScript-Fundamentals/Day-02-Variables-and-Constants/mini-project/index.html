<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 02 — Personal Info Profile Manager</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 2rem;
    }
    .profile-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2rem;
      max-width: 500px;
      margin: 0 auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h2 { color: #38bdf8; margin-top: 0; }
    .info-row { margin-bottom: 0.75rem; color: #cbd5e1; }
    .label { font-weight: bold; color: #94a3b8; }
    button {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      margin-top: 1rem;
      margin-right: 0.5rem;
    }
    button:hover { background-color: #0369a1; }
  </style>
  <script src="script.js" defer></script>
</head>
<body>

  <div class="profile-card">
    <h2>👤 User Profile Manager</h2>
    <div class="info-row"><span class="label">ID (const):</span> <span id="userIdVal">Loading...</span></div>
    <div class="info-row"><span class="label">Name (const Object property):</span> <span id="userNameVal">Loading...</span></div>
    <div class="info-row"><span class="label">Age (let reassignable):</span> <span id="userAgeVal">Loading...</span></div>
    <div class="info-row"><span class="label">Status (let reassignable):</span> <span id="userStatusVal">Loading...</span></div>

    <div>
      <button onclick="incrementAge()">Increment Age</button>
      <button onclick="updateRole()">Promote Role</button>
      <button onclick="attemptConstReassign()">Test Const Reassign</button>
    </div>
  </div>

</body>
</html>
