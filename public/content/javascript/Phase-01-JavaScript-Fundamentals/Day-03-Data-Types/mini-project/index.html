<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 03 — Data Type Explorer</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 2rem;
    }
    .explorer-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2rem;
      max-width: 650px;
      margin: 0 auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h2 { color: #38bdf8; margin-top: 0; }
    .input-group { margin-bottom: 1.5rem; }
    input[type="text"] {
      width: 100%;
      padding: 0.75rem;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #38bdf8;
      font-family: monospace;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      margin-right: 0.5rem;
      margin-bottom: 0.5rem;
    }
    button:hover { background-color: #0369a1; }
    .result-box {
      background-color: #090d16;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 1.25rem;
      font-family: monospace;
      margin-top: 1rem;
      line-height: 1.8;
    }
    .val-highlight { color: #4ade80; }
    .type-highlight { color: #f43f5e; }
  </style>
  <script src="script.js" defer></script>
</head>
<body>

  <div class="explorer-card">
    <h2>🔍 JavaScript Data Type Explorer</h2>
    <p style="color: #94a3b8;">Enter any JavaScript expression or click a preset sample below to analyze its type metrics!</p>

    <div class="input-group">
      <input type="text" id="exprInput" value="[1, 2, 3]">
    </div>

    <div>
      <button onclick="analyzeExpression()">Inspect Expression</button>
      <button onclick="setSample('0.1 + 0.2')">0.1 + 0.2</button>
      <button onclick="setSample('null')">null</button>
      <button onclick="setSample('100n')">100n</button>
      <button onclick="setSample('{ name: &quot;Alice&quot; }')">Object</button>
    </div>

    <div id="resultBox" class="result-box">Click "Inspect Expression" to view memory & type analysis.</div>
  </div>

</body>
</html>
