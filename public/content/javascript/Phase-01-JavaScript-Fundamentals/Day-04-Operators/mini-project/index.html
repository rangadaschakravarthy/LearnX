<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 04 — JavaScript Expression Calculator</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 2rem;
    }
    .calc-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2rem;
      max-width: 600px;
      margin: 0 auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h2 { color: #38bdf8; margin-top: 0; }
    .input-box {
      width: 100%;
      padding: 0.8rem;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #38bdf8;
      font-family: monospace;
      font-size: 1.1rem;
      box-sizing: border-box;
      margin-bottom: 1rem;
    }
    button {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-right: 0.4rem;
      margin-bottom: 0.4rem;
    }
    button:hover { background-color: #0369a1; }
    .display {
      background-color: #090d16;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 1.25rem;
      font-family: monospace;
      margin-top: 1rem;
      color: #4ade80;
      font-size: 1.1rem;
    }
  </style>
  <script src="script.js" defer></script>
</head>
<body>

  <div class="calc-card">
    <h2>🧮 Expression Calculator & Operator Inspector</h2>
    <input type="text" id="calcInput" class="input-box" value="10 + 5 * 2 ** 3">

    <div>
      <button onclick="calculateExpr()">Evaluate</button>
      <button onclick="preset('5 + 3 * 2')">5 + 3 * 2</button>
      <button onclick="preset('0 || &quot;Fallback&quot;')">0 || "Fallback"</button>
      <button onclick="preset('0 ?? &quot;Fallback&quot;')">0 ?? "Fallback"</button>
      <button onclick="preset('&quot;Cat&quot; &amp;&amp; &quot;Dog&quot;')">"Cat" &amp;&amp; "Dog"</button>
    </div>

    <div id="calcDisplay" class="display">Result will appear here.</div>
  </div>

</body>
</html>
